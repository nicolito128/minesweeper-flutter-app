name: Deploy Minesweeper Flutter Web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install deps
        run: flutter pub get

      - name: Compile for web
        run: flutter build web --release --base-href "/minesweeper/"

      - name: Setup Github Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Desploy on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4